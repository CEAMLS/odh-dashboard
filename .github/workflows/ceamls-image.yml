# CEAMLS: build the dashboard image and the Gen AI studio module image from
# this branch and push them to quay.io. The cluster pins the pushed digests
# (printed in the job summary) in the ceamls_ai_cluster GitOps repo; tags are
# for humans only.
#
# Repository settings:
#   variable QUAY_IMAGE_REPO         e.g. quay.io/<org>/odh-dashboard
#   variable QUAY_GEN_AI_IMAGE_REPO  e.g. quay.io/<org>/odh-gen-ai
#   secret   QUAY_ROBOT_USERNAME     quay.io robot account with write on both
#   secret   QUAY_ROBOT_TOKEN
name: CEAMLS dashboard image
on:
  push:
    branches:
      - ceamls/sidebar-3.6
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ceamls-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Git checkout
        uses: actions/checkout@v4

      - name: Set image tags
        shell: bash
        run: |
          echo "SHORT_SHA=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to quay.io
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_ROBOT_USERNAME }}
          password: ${{ secrets.QUAY_ROBOT_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ vars.QUAY_IMAGE_REPO }}:v3.6.0-ea2-odh-ceamls-${{ env.SHORT_SHA }}
            ${{ vars.QUAY_IMAGE_REPO }}:ceamls-sidebar-3.6
          cache-from: type=gha,scope=dashboard
          cache-to: type=gha,mode=max,scope=dashboard

      - name: Summary
        shell: bash
        run: |
          {
            echo "### Dashboard image"
            echo
            echo "Pin this in gitops (RELATED_IMAGE_ODH_DASHBOARD_IMAGE):"
            echo
            echo '```'
            echo "${{ vars.QUAY_IMAGE_REPO }}@${{ steps.build.outputs.digest }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # The Gen AI studio is a module-federation remote served by its own pod
  # (deployment gen-ai-ui), so it ships as its own image: the module's
  # frontend plus its BFF. Built from the repository root.
  build-gen-ai:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Git checkout
        uses: actions/checkout@v4

      - name: Set image tags
        shell: bash
        run: |
          echo "SHORT_SHA=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to quay.io
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_ROBOT_USERNAME }}
          password: ${{ secrets.QUAY_ROBOT_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/gen-ai/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ vars.QUAY_GEN_AI_IMAGE_REPO }}:v3.6.0-ea2-odh-ceamls-${{ env.SHORT_SHA }}
            ${{ vars.QUAY_GEN_AI_IMAGE_REPO }}:ceamls-sidebar-3.6
          cache-from: type=gha,scope=gen-ai
          cache-to: type=gha,mode=max,scope=gen-ai

      - name: Summary
        shell: bash
        run: |
          {
            echo "### Gen AI studio image"
            echo
            echo "Pin this in gitops (RELATED_IMAGE_ODH_MOD_ARCH_GEN_AI_IMAGE):"
            echo
            echo '```'
            echo "${{ vars.QUAY_GEN_AI_IMAGE_REPO }}@${{ steps.build.outputs.digest }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
